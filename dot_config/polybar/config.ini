; Everforest Dark Hard — Flat Minimal Bar (Polybar)
; Matches Waybar Everforest Dark Hard palette and unified 12pt Hack Nerd Font

[colors]
bg = #272e33
bg-alt = #2e383c
bg-surface = #374145
border = #414b50
fg = #d3c6aa
subtext = #9da9a0
muted = #859289
black = #1e2326
red = #e67e80
green = #a7c080
yellow = #dbbc7f
blue = #7fbbb3
magenta = #d699b6
cyan = #83c092
orange = #e69875

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

border-bottom-size = 1
border-bottom-color = ${colors.border}

padding-left = 0
padding-right = 1
module-margin = 0

separator = "  "
separator-foreground = ${colors.border}

font-0 = "Hack Nerd Font:size=12;3"
font-1 = "Hack Nerd Font:style=Bold:size=12;3"
font-2 = "Hack Nerd Font Mono:size=12;3"

modules-left = i3 scratchpad
modules-center = hostname
modules-right = pulseaudio network cpu load memory disk clock tray

enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

format = <label-state><label-mode>

label-focused = %name%
label-focused-background = ${colors.green}
label-focused-foreground = ${colors.black}
label-focused-font = 2
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 1

label-visible = %name%
label-visible-background = ${colors.bg-surface}
label-visible-foreground = ${colors.fg}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.black}
label-urgent-font = 2
label-urgent-padding = 1

label-mode = %mode%
label-mode-background = ${colors.orange}
label-mode-foreground = ${colors.black}
label-mode-font = 2
label-mode-padding = 1
label-mode-margin-left = 1

[module/scratchpad]
type = custom/script
exec = ~/.config/polybar/scripts/scratchpad.sh
tail = true
click-left = i3-msg scratchpad show >/dev/null

[module/hostname]
type = custom/script
exec = hostname -s
interval = 300
format-prefix = "󰒋 "
format-prefix-foreground = ${colors.blue}
label = %output%
label-foreground = ${colors.fg}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 2

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.orange}

format-muted = <label-muted>
label-muted = 󰝟
label-muted-foreground = ${colors.red}

click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/network]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/network.sh
initial = 1
click-left = ~/.config/polybar/scripts/network.sh toggle

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 80
format = %{A1:~/.config/polybar/scripts/sysmon.sh &:}<label>%{A}
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.green}
label = %percentage%%
format-warn = %{A1:~/.config/polybar/scripts/sysmon.sh &:}<label-warn>%{A}
format-warn-prefix = "󰘚 "
format-warn-prefix-foreground = ${colors.red}
label-warn = %percentage%%
label-warn-foreground = ${colors.red}

[module/load]
type = custom/script
exec = awk '{print $1}' /proc/loadavg
interval = 5
click-left = ~/.config/polybar/scripts/sysmon.sh &
format-prefix = "󰓅 "
format-prefix-foreground = ${colors.yellow}
label = %output%

[module/memory]
type = internal/memory
interval = 5
warn-percentage = 85
format = %{A1:~/.config/polybar/scripts/sysmon.sh &:}<label>%{A}
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.magenta}
label = %percentage_used%%
format-warn = %{A1:~/.config/polybar/scripts/sysmon.sh &:}<label-warn>%{A}
format-warn-prefix = "󰍛 "
format-warn-prefix-foreground = ${colors.red}
label-warn = %percentage_used%%
label-warn-foreground = ${colors.red}

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
fixed-values = true
warn-percentage = 90
format-mounted = %{A1:alacritty --class floater -e gdu / &:}<label-mounted>%{A}
label-mounted = %{F#83c092}󰋊%{F-} %percentage_used%%
format-warn = %{A1:alacritty --class floater -e gdu / &:}<label-warn>%{A}
label-warn = %{F#e67e80}󰋊 %percentage_used%%%{F-}

[module/tray]
type = internal/tray
tray-spacing = 6px
tray-size = 16px
tray-background = ${colors.bg}

[module/clock]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/clock.sh print
initial = 1
click-left = ~/.config/polybar/scripts/clock.sh toggle-format
click-right = ~/.config/polybar/scripts/clock.sh toggle-mode
click-middle = ~/.config/polybar/scripts/clock.sh tz-next
scroll-up = ~/.config/polybar/scripts/clock.sh scroll-up
scroll-down = ~/.config/polybar/scripts/clock.sh scroll-down

[settings]
screenchange-reload = true
pseudo-transparency = false
