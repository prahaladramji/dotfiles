general {
  output_format = "i3bar"
  interval = 5
  markup = "pango"

  colors = true
  color_good = "#D3C6AA"
  color_degraded = "#DBBC7F"
  color_bad = "#E67E80"
}

order += "read_file hostname"
order += "ethernet _first_"
order += "cpu_usage"
order += "load"
order += "memory"
order += "disk /"
order += "tztime pacific"
order += "time"

read_file hostname {
  format = "<span foreground='#7fbbb3'>󰒋</span> %content"
  path = "/etc/hostname"
}

ethernet _first_ {
  format_up = "<span foreground='#7fbbb3'>󰈀</span> %ip"
  format_down = "<span foreground='#e67e80'>󰖪</span> down"
}

cpu_usage {
  format = "<span foreground='#a7c080'>󰘚</span> %usage"
  degraded_threshold = 75
  max_threshold = 90
}

load {
  format = "<span foreground='#dbbc7f'>󰓅</span> %1min"
}

memory {
  format = "<span foreground='#d699b6'>󰍛</span> %percentage_used"
  threshold_degraded = "20%"
  threshold_critical = "10%"
  format_degraded = "<span foreground='#d699b6'>󰍛</span> %percentage_used"
}

disk "/" {
  format = "<span foreground='#83c092'>󰋊</span> %percentage_used"
  low_threshold = 10
  threshold_type = "percentage_avail"
}

tztime pacific {
  format = "<span foreground='#d699b6'>󰖟</span> %H:%M"
  timezone = "PST8PDT"
}

time {
  format = "<span foreground='#7fbbb3'>󰥔</span> %H:%M · %b %d"
}
