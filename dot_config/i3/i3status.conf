general {
  output_format = "i3bar"
  interval = 5
  markup = "pango"

  colors = true
  color_good = "#C0CAF5"
  color_degraded = "#E0AF68"
  color_bad = "#F7768E"
}

order += "read_file hostname"
order += "ethernet _first_"
order += "cpu_usage"
order += "load"
order += "memory"
order += "disk /"
order += "tztime mtv"
order += "time"

read_file hostname {
  format = "<span foreground='#7aa2f7'>󰒋</span> %content"
  path = "/etc/hostname"
}

ethernet _first_ {
  format_up = "<span foreground='#7aa2f7'>󰈀</span> %ip"
  format_down = "<span foreground='#f7768e'>󰖪</span> down"
}

cpu_usage {
  format = "<span foreground='#9ece6a'>󰘚</span> %usage"
  degraded_threshold = 75
  max_threshold = 90
}

load {
  format = "<span foreground='#e0af68'>󰓅</span> %1min"
}

memory {
  format = "<span foreground='#bb9af7'>󰍛</span> %percentage_used"
  threshold_degraded = "20%"
  threshold_critical = "10%"
  format_degraded = "<span foreground='#bb9af7'>󰍛</span> %percentage_used"
}

disk "/" {
  format = "<span foreground='#7dcfff'>󰋊</span> %percentage_used"
  low_threshold = 10
  threshold_type = "percentage_avail"
}

tztime mtv {
  format = "<span foreground='#bb9af7'>󰊭</span> %H:%M"
  timezone = "PST8PDT"
}

time {
  format = "<span foreground='#7aa2f7'>󰥔</span> %H:%M · %b %d"
}
