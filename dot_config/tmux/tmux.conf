set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB,alacritty:RGB,tmux-256color:RGB"
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g focus-events on

unbind-key C-b
set-option -g prefix C-a
bind-key -N "Send the prefix key through to the application" C-a send-prefix

set-window-option -g clock-mode-style 24
set-option -s escape-time 0
set-option -g history-limit 100000
set-option -sg repeat-time 600

set-option -ag terminal-overrides ",xterm*:Ms=\\E]52;c%p1%s;%p2%s\\7"
set-option -s set-clipboard on
set-option -g allow-passthrough on

# reload tmux config
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set-window-option -g automatic-rename on    # rename window to reflect current program
set-option -g renumber-windows on           # renumber windows when a window is closed
set-option -g set-titles on                 # set terminal title
set-option -g set-titles-string '#I:#W | #h'
set-option -g display-panes-time 800        # slightly longer pane indicators display time
set-option -g display-time 1000             # slightly longer status messages display time
set-option -g status-interval 10            # redraw status line every 10 seconds

# clear both screen and history (with prefix C-a C-l so plain C-l works in Neovim/shell)
bind-key C-l send-keys C-l \; clear-history

# activity
set-option -g monitor-activity on
set-option -g visual-activity off

# open new windows and splits in the current pane's working directory
bind-key c new-window -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key _ split-window -h -c "#{pane_current_path}"

# enable mouse mode
set-option -g mouse on
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# use alt-arrow keys without prefix key to switch panes
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

bind-key = if-shell -F "#{pane_synchronized}" {
  set-window-option synchronize-panes off
  set-window-option -u window-style
  set-window-option -u pane-border-style
  refresh-client -S
} {
  set-window-option synchronize-panes on
  set-window-option window-style "fg=#d3c6aa,bg=terminal"
  set-window-option pane-border-style "fg=#e67e80"
  refresh-client -S
}

# Everforest Dark Hard colors for Tmux
set-option -g mode-style "fg=#d3c6aa,bg=#414b50"

set-option -g message-style "fg=#d3c6aa,bg=#374145"
set-option -g message-command-style "fg=#d3c6aa,bg=#374145"

set-option -g pane-border-style "fg=#414b50"
set-option -g pane-active-border-style "#{?pane_synchronized,fg=#e67e80,fg=#a7c080}"

set-option -g window-style "fg=#7a8478,bg=terminal"
set-option -g window-active-style "fg=#d3c6aa,bg=terminal"

set-option -g status "on"
set-option -g status-justify "left"

set-option -g status-style "fg=#d3c6aa,bg=#1e2326"

set-option -g status-left-length "100"
set-option -g status-right-length "100"

set-option -g status-left-style NONE
set-option -g status-right-style NONE

set-option -g status-left "#[fg=#1e2326,bg=#a7c080,bold] #S #[fg=#a7c080,bg=#1e2326,nobold,nounderscore,noitalics]"

set-option -g status-right "#[fg=#1e2326,bg=#1e2326,nobold,nounderscore,noitalics]#[fg=#a7c080,bg=#1e2326]#{?client_prefix,#[fg=#1e2326#,bg=#dbbc7f#,bold] PREFIX #[fg=#a7c080#,bg=#1e2326#,nobold],}#{?pane_synchronized,#[fg=#1e2326#,bg=#e67e80#,bold] SYNC #[fg=#a7c080#,bg=#1e2326#,nobold],} #[fg=#374145,bg=#1e2326,nobold,nounderscore,noitalics]#[fg=#d3c6aa,bg=#374145] %Y-%m-%d  %H:%M #[fg=#a7c080,bg=#374145,nobold,nounderscore,noitalics]#[fg=#1e2326,bg=#a7c080,bold] #h "

set-window-option -g window-status-activity-style "underscore,fg=#9da9a0,bg=#1e2326"
set-window-option -g window-status-separator ""
set-window-option -g window-status-style "NONE,fg=#9da9a0,bg=#1e2326"
set-window-option -g window-status-format "#[fg=#1e2326,bg=#1e2326,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1e2326,bg=#1e2326,nobold,nounderscore,noitalics]"
set-window-option -g window-status-current-format "#{?pane_synchronized,#[fg=#1e2326#,bg=#e67e80#,nobold#,nounderscore#,noitalics]#[fg=#1e2326#,bg=#e67e80#,bold] #I  #W #F #[fg=#e67e80#,bg=#1e2326#,nobold#,nounderscore#,noitalics],#[fg=#1e2326#,bg=#374145#,nobold#,nounderscore#,noitalics]#[fg=#a7c080#,bg=#374145#,bold] #I  #W #F #[fg=#374145#,bg=#1e2326#,nobold#,nounderscore#,noitalics]}"

# Toggle all keybindings on/off with F12 so nested/remote tmux sessions receive C-a directly
# see: https://github.com/tmux/tmux/issues/237
bind-key -T root F12 {
  set-option prefix None
  set-option key-table off
  if -F "#{pane_in_mode}" "send-keys -X cancel"
  refresh-client -S
}

bind-key -T off F12 {
  set-option -u prefix
  set-option -u key-table
  refresh-client -S
}
