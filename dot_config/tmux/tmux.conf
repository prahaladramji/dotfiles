set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB,alacritty:RGB,tmux-256color:RGB"
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g focus-events on

unbind-key C-b
set-option -g prefix C-a
bind-key -N "Send the prefix key through to the application" C-a send-prefix

set-window-option -g clock-mode-style 24
set-option -s escape-time 0
set-option -g history-limit 100000
set-option -sg repeat-time 600

set-option -ag terminal-overrides ",xterm*:Ms=\\E]52;c%p1%s;%p2%s\\7"
set-option -s set-clipboard on
set-option -g allow-passthrough on

# reload tmux config
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set-window-option -g automatic-rename on    # rename window to reflect current program
set-option -g renumber-windows on           # renumber windows when a window is closed
set-option -g set-titles on                 # set terminal title
set-option -g set-titles-string '#I:#W | #h'
set-option -g display-panes-time 800        # slightly longer pane indicators display time
set-option -g display-time 1000             # slightly longer status messages display time
set-option -g status-interval 10            # redraw status line every 10 seconds

# clear both screen and history (with prefix C-a C-l so plain C-l works in Neovim/shell)
bind-key C-l send-keys C-l \; clear-history

# activity
set-option -g monitor-activity on
set-option -g visual-activity off

# open new windows and splits in the current pane's working directory
bind-key c new-window -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key _ split-window -h -c "#{pane_current_path}"

# enable mouse mode
set-option -g mouse on
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# use alt-arrow keys without prefix key to switch panes
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

bind-key = set-window-option synchronize-panes \; refresh-client -S

# TokyoNight colors for Tmux
set-option -g mode-style "fg=#7aa2f7,bg=#3b4261"

set-option -g message-style "fg=#7aa2f7,bg=#3b4261"
set-option -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set-option -g pane-border-style "fg=#3b4261"
set-option -g pane-active-border-style "#{?pane_synchronized,fg=#f7768e,fg=#7aa2f7}"

set-option -g window-style "bg=colour237"
set-option -g window-active-style "bg=terminal"

set-option -g status "on"
set-option -g status-justify "left"

set-option -g status-style "fg=#7aa2f7,bg=#16161e"

set-option -g status-left-length "100"
set-option -g status-right-length "100"

set-option -g status-left-style NONE
set-option -g status-right-style NONE

set-option -g status-left "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"

set-option -g status-right "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#16161e]#{?client_prefix,#[fg=#15161e#,bg=#e0af68#,bold] PREFIX #[fg=#7aa2f7#,bg=#16161e#,nobold],}#{?pane_synchronized,#[fg=#15161e#,bg=#f7768e#,bold] SYNC #[fg=#7aa2f7#,bg=#16161e#,nobold],} #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %H:%M #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161e,bg=#7aa2f7,bold] #h "

set-window-option -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
set-window-option -g window-status-separator ""
set-window-option -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
set-window-option -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
set-window-option -g window-status-current-format "#{?pane_synchronized,#[fg=#16161e#,bg=#f7768e#,nobold#,nounderscore#,noitalics]#[fg=#15161e#,bg=#f7768e#,bold] #I  #W #F #[fg=#f7768e#,bg=#16161e#,nobold#,nounderscore#,noitalics],#[fg=#16161e#,bg=#3b4261#,nobold#,nounderscore#,noitalics]#[fg=#7aa2f7#,bg=#3b4261#,bold] #I  #W #F #[fg=#3b4261#,bg=#16161e#,nobold#,nounderscore#,noitalics]}"

# Toggle all keybindings on/off with F12 so nested/remote tmux sessions receive C-a directly
# see: https://github.com/tmux/tmux/issues/237
bind-key -T root F12 {
  set-option prefix None
  set-option key-table off
  if -F "#{pane_in_mode}" "send-keys -X cancel"
  refresh-client -S
}

bind-key -T off F12 {
  set-option -u prefix
  set-option -u key-table
  refresh-client -S
}
